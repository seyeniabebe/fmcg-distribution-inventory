spring.application.name=fmcg-dms
server.port=8080

# Production PostgreSQL Datasource Configuration
# Overridable via DB_URL, DB_USERNAME, and DB_PASSWORD environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fmcg_dms}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:fmcg_user}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Sample data seed control (disabled to prevent clobbering migrated data)
app.seed.enabled=false

# Session and Cookie Security configuration
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# Security migration control (disabled — migration already completed)
app.security.migrate-passwords=false

# Disable Spring Security auto-config (we use manual session auth)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Multipart file upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
